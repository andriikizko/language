<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Голосовий перекладач</title>
<meta name="theme-color" content="#FFFFFF">
<style>
:root{--bg:#fff;--ink:#2B1608;--dim:#8A6A55;--line:#F6DCC6;--soft:#FFF7ED;--o4:#FB923C;--o6:#EA580C;--a:#fff7ed;--b:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#16100b;--ink:#F6EADF;--dim:#A99381;--line:#35271c;--soft:#25170d;--a:#2a1a0f;--b:#1e150e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,-apple-system,'Segoe UI',Roboto,sans-serif;overflow-wrap:break-word}
.app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px calc(12px + env(safe-area-inset-bottom))}
button,select,input{font-family:inherit;color:var(--ink)}
.top{display:flex;align-items:center;gap:8px;padding:12px 0 10px}
.sel{position:relative;flex:1;min-width:0}
.sel select{width:100%;appearance:none;-webkit-appearance:none;border:1.5px solid var(--line);background:var(--soft);border-radius:14px;padding:11px 12px;font-size:15px;font-weight:800;text-overflow:ellipsis}
.sw{flex:0 0 42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.log{flex:1;overflow-y:auto;padding:6px 0 10px;display:flex;flex-direction:column;gap:10px}
.empty{margin:auto;text-align:center;color:var(--dim);font-size:15px;line-height:1.5;padding:0 20px}
.empty .big{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--o6)}
.m{max-width:86%;border-radius:18px;padding:11px 14px;line-height:1.35}
.m.a{align-self:flex-start;background:var(--a);border:1px solid var(--line);border-bottom-left-radius:6px}
.m.b{align-self:flex-end;background:var(--b);border:1.5px solid var(--o4);border-bottom-right-radius:6px}
.m small{display:block;color:var(--dim);font-size:12px;margin-bottom:4px;font-weight:700}
.m .tr{font-size:18px;font-weight:800}.m .org{font-size:13px;color:var(--dim);margin-top:5px}
.m .pl{margin-top:6px;border:0;background:none;color:var(--o6);padding:2px 0;display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px}
.m .pl .ic{width:18px;height:18px}
.m.err .tr{color:#dc2626;font-size:14px}
.tx{display:flex;gap:8px;margin:2px 0 10px}
.tx input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:16px;background:var(--bg)}
.tx button{flex:0 0 46px;border:0;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--o6)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mic{border:2px solid var(--line);background:var(--soft);border-radius:22px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:800;font-size:15px;min-width:0}
.mic .c{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#FB923C,#EA580C);display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px rgba(234,88,12,.35)}
.mic .c .ic{width:28px;height:28px}
.mic.on{border-color:var(--o6)}.mic.on .c{animation:p 1s infinite}
.mic.sel1{border-color:var(--o4)}
.mic small{font-weight:700;color:var(--dim);font-size:12px;line-height:1.2;text-align:center}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(234,88,12,.5)}100%{box-shadow:0 0 0 20px rgba(234,88,12,0)}}
.note{font-size:12px;color:var(--dim);text-align:center;margin-top:8px;min-height:16px}
.clr{border:0;background:none;color:var(--dim);font-size:12px;font-weight:700;padding:4px 8px;display:flex;align-items:center;gap:4px}.clr .ic{width:16px;height:16px}
.hd{display:flex;justify-content:space-between;align-items:center;padding-top:10px}.hd b{font-size:18px;letter-spacing:-.01em}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></symbol>
<symbol id="swap" viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>
<symbol id="spk" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/></symbol>
<symbol id="send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></symbol>
<symbol id="bin" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
</defs></svg>
<div class="app">
 <div class="hd"><b>Перекладач</b><button class="clr" id="clr"><svg class="ic"><use href="#bin"/></svg>Очистити</button></div>
 <div class="top">
  <div class="sel"><select id="la"></select></div>
  <button class="sw" id="sw" aria-label="Поміняти мови"><svg class="ic"><use href="#swap"/></svg></button>
  <div class="sel"><select id="lb"></select></div>
 </div>
 <div class="log" id="log"></div>
 <div class="tx"><input id="in" placeholder="Або напиши текст" enterkeyhint="send"><button id="go" aria-label="Надіслати"><svg class="ic"><use href="#send"/></svg></button></div>
 <div class="btns">
  <button class="mic" id="ma"><span class="c"><svg class="ic"><use href="#mic"/></svg></span><span id="na"></span><small>тисни й говори</small></button>
  <button class="mic" id="mb"><span class="c"><svg class="ic"><use href="#mic"/></svg></span><span id="nb"></span><small>тисни й говори</small></button>
 </div>
 <div class="note" id="note"></div>
</div>
<script>
const LANGS=[['uk','Українська','uk-UA'],['en','English','en-US'],['de','Deutsch','de-DE'],['pl','Polski','pl-PL'],['ru','Русский','ru-RU'],['fr','Français','fr-FR'],['it','Italiano','it-IT'],['es','Español','es-ES'],['tr','Türkçe','tr-TR']];
const L=Object.fromEntries(LANGS.map(l=>[l[0],l]));
const $=s=>document.getElementById(s);
let S={a:'uk',b:'en',log:[],side:'a'};
try{const z=JSON.parse(localStorage.getItem('tr.state'));if(z&&L[z.a]&&L[z.b])S={...S,a:z.a,b:z.b,log:(z.log||[]).slice(-40)}}catch(e){}
const save=()=>{try{localStorage.setItem('tr.state',JSON.stringify({a:S.a,b:S.b,log:S.log.slice(-40)}))}catch(e){}};
const opts=()=>LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join('');
$('la').innerHTML=opts();$('lb').innerHTML=opts();
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=null;
function names(){$('la').value=S.a;$('lb').value=S.b;$('na').textContent=S.a.toUpperCase();$('nb').textContent=S.b.toUpperCase()}
function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
 const el=$('log');
 if(!S.log.length){el.innerHTML=`<div class="empty"><div class="big"><svg class="ic" style="width:30px;height:30px"><use href="#mic"/></svg></div>Обери мови зверху.<br>Тисни свою кнопку, говори, і співрозмовник почує переклад.<br>Потім він тисне свою.</div>`}
 else el.innerHTML=S.log.map((m,i)=>m.err?`<div class="m ${m.side} err"><div class="tr">${esc(m.err)}</div></div>`:`<div class="m ${m.side}"><small>${L[m.from][1]} → ${L[m.to][1]}</small><div class="tr">${esc(m.tr)}</div><div class="org">${esc(m.src)}</div><button class="pl" data-i="${i}"><svg class="ic"><use href="#spk"/></svg>Послухати</button></div>`).join('');
 el.scrollTop=el.scrollHeight;
 el.querySelectorAll('.pl').forEach(b=>b.onclick=()=>{const m=S.log[+b.dataset.i];say(m.tr,m.to)});
 $('ma').classList.toggle('sel1',S.side==='a');$('mb').classList.toggle('sel1',S.side==='b');
}
function say(t,lang){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=L[lang][2];const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
async function translate(text,from,to){
 const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+from+'|'+to);
 if(!r.ok)throw new Error('http');
 const j=await r.json();
 const t=j&&j.responseData&&j.responseData.translatedText;
 if(!t||j.responseStatus&&+j.responseStatus!==200)throw new Error('empty');
 const d=document.createElement('textarea');d.innerHTML=t;return d.value;
}
async function handle(side,text){
 text=(text||'').trim();if(!text)return;
 S.side=side;
 const from=side==='a'?S.a:S.b,to=side==='a'?S.b:S.a;
 $('note').textContent='Перекладаю…';
 try{const tr=await translate(text,from,to);S.log.push({side,from,to,src:text,tr});save();render();say(tr,to);$('note').textContent=''}
 catch(e){S.log.push({side,err:'Не вдалося перекласти. Перевір інтернет і спробуй ще раз.'});render();$('note').textContent=''}
}
function listen(side){
 if(listening){try{rec.stop()}catch(e){}if(listening===side){return}}
 if(!SR){$('note').textContent='Цей браузер не слухає голос. Напиши текст у полі зверху.';$('in').focus();S.side=side;render();return}
 const lang=side==='a'?S.a:S.b;
 rec=new SR();rec.lang=L[lang][2];rec.interimResults=false;rec.maxAlternatives=1;
 let got='';
 rec.onresult=e=>{got=e.results[0][0].transcript};
 rec.onerror=e=>{$('note').textContent=e.error==='not-allowed'?'Дозволь доступ до мікрофона в браузері.':e.error==='no-speech'?'Нічого не почув. Спробуй ще раз.':'Не вдалося записати голос.'};
 rec.onend=()=>{$('m'+listening).classList.remove('on');const sd=listening;listening=null;if(got){$('note').textContent='';handle(sd,got)}};
 listening=side;S.side=side;$('m'+side).classList.add('on');$('note').textContent='Слухаю… говори';render();
 try{rec.start()}catch(e){listening=null;$('m'+side).classList.remove('on')}
}
$('ma').onclick=()=>listen('a');$('mb').onclick=()=>listen('b');
$('la').onchange=e=>{S.a=e.target.value;if(S.a===S.b)S.b=LANGS.find(l=>l[0]!==S.a)[0];names();save()};
$('lb').onchange=e=>{S.b=e.target.value;if(S.a===S.b)S.a=LANGS.find(l=>l[0]!==S.b)[0];names();save()};
$('sw').onclick=()=>{[S.a,S.b]=[S.b,S.a];names();save()};
const send=()=>{const v=$('in').value;$('in').value='';handle(S.side,v)};
$('go').onclick=send;$('in').onkeydown=e=>{if(e.key==='Enter')send()};
$('clr').onclick=()=>{S.log=[];save();render()};
names();render();try{speechSynthesis.getVoices()}catch(e){}
</script></body></html>
